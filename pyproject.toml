[project]
name = "object-oriented-design-principles"
version = "0.1.0"
description = "Reference catalogue of SOLID object-oriented design examples in Python"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
]

linters = [
    "mypy>=1.19.1",
    "ruff>=0.15.2",
]

tests = [
    "hypothesis>=6.151.9",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
]

[tool.ruff]
line-length = 79
indent-width = 4
target-version = "py312"
extend-exclude = [
    ".venv",
    ".pytest_cache",
    ".hypothesis",
    ".vscode",
    "docs",
]

[tool.ruff.lint]
select = [
    "B",       # flake8-bugbear
    "C4",      # flake8-comprehensions
    "D",       # pydocstyle
    "E",       # pycodestyle (error)
    "F",       # pyflakes
    "I",       # isort
    "ISC",     # flake8-implicit-str-concat
    "PIE",     # flake8-pie
    "PLE0237", # pylint(E) non-slot-assignment
    "PT",      # flake8-pytest-style
    "RET",     # flake8-return
    "S",       # flake8-bandit
    "SIM",     # flake8-simplify
    "T10",     # flake8-debugger
    "T20",     # flake8-print
    "TD",      # flake8-todos
    "UP",      # pyupgrade
    "W"        # pycodestyle (warning)
]

ignore = [
    "D100",   # Missing docstring in public module
    "D101",   # Missing docstring in public class
    "D102",   # Missing docstring in public method
    "D103",   # Missing docstring in public function
    "D104",   # Missing docstring in public package
    "D105",   # Missing docstring in magic method
    "D106",   # Missing docstring in public nested class
    "D107",   # Missing docstring in __init__
    "RET503", # Missing explicit return at the end of function able to return non-None value
    "SIM102", # Use a single if statement instead of nested if statements
    "TD003"   # Missing issue link on the line following this TODO
]

unfixable = [
    "F601",  # Dictionary key literal {name} repeated
    "F602",  # Dictionary key {name} repeated
    "SIM112" # Use capitalized environment variable {expected} instead of {actual}
]

[tool.ruff.lint.isort]
order-by-type = true
lines-between-types = 1

[tool.ruff.lint.pydocstyle]
convention = "numpy"
[tool.ruff.lint.per-file-ignores]
"{single_responsibility,open_close,substitution,interface_segregation,dependency_inversion}/*" = [
    "T201", # print: the examples show their result on the console
    "S311", # random: used only to simulate business rules in the demos
]
"tests/*" = [
    "S101", # Use of assert detected
    "DOC201"
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true
# Passing an ABC where type[T] is expected (e.g. container.resolve(
# ProductRepository)) is valid Python, but mypy rejects it (mypy#4717).
disable_error_code = ["type-abstract"]
exclude = ['^\.venv/']

[tool.pytest.ini_options]
pythonpath = ["."]
python_files = ["test_*.py"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: fast-running unit tests",
    "integration: integration tests hitting components or boundaries",
]
